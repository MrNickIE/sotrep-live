# One-off: deletes the v1.0.0 and v1.0.1 releases and their tags. Delete this file once it has run.

name: Remove old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Make sure a newer release exists first
        run: gh release view v1.0.2 --json assets --jq '.assets[].name' | grep -qx sotrep-live.user.js

      - name: Delete v1.0.0 and v1.0.1
        run: |
          for t in v1.0.0 v1.0.1; do
            if gh release view "$t" >/dev/null 2>&1; then
              gh release delete "$t" --cleanup-tag --yes
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" 2>/dev/null || true
            echo "Removed $t"
          done
          gh release list
