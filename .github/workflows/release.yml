# Builds a GitHub release with sotrep-live.user.js attached.
# Two ways to start it:
#   - Run workflow (Actions tab, or the API) on a branch: tags that commit with v + @version and releases it.
#   - Push a v* tag by hand: releases that tag.
# Checks run first so a bad version never produces a release.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned so a moved tag cannot change what runs
        with:
          fetch-depth: 0

      - name: Work out the tag
        run: |
          ver=$(grep -m1 -oP '^// @version\s+\K\S+' sotrep-live.user.js)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$ver" ]; then
              echo "::error::Tag $tag does not match @version $ver in sotrep-live.user.js"
              exit 1
            fi
          else
            tag="v$ver"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump @version first."
              exit 1
            fi
          fi
          echo "Releasing $tag from $GITHUB_SHA"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Meta file matches script header
        run: |
          if ! diff <(sed -n '/==UserScript==/,/==\/UserScript==/p' sotrep-live.user.js) sotrep-live.meta.js; then
            echo "::error::sotrep-live.meta.js is out of date. Regenerate it from the script header."
            exit 1
          fi

      - name: Syntax check
        run: node -e "new Function(require('fs').readFileSync('sotrep-live.user.js','utf8').replace(/GM_\w+/g,'undefined'))"

      - name: No em or en dashes
        run: |
          n=$(cat sotrep-live.user.js README.md | grep -cP '\x{2014}|\x{2013}' || true)
          if [ "$n" != "0" ]; then
            grep -nP '\x{2014}|\x{2013}' sotrep-live.user.js README.md
            echo "::error::Found $n line(s) with em or en dashes"
            exit 1
          fi

      - name: Release notes
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          range=${prev:+$prev..}HEAD
          git log "$range" --no-merges --format='- %s' -- sotrep-live.user.js | grep -vE '^- (v?[0-9]+(\.[0-9]+)+|Add files via upload|Update [^ ]+\.(js|md))$' > notes.md || true
          [ -s notes.md ] || echo '- Maintenance release' > notes.md
          { echo; echo "Install or update: https://github.com/MrNickIE/sotrep-live/releases/latest/download/sotrep-live.user.js"; } >> notes.md
          cat notes.md

      - name: Create release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sotrep-live.user.js --clobber
          else
            gh release create "$TAG" sotrep-live.user.js \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --latest
          fi
